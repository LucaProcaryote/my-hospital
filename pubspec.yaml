name: portal_app
description: >-
  Mini-Hospital 2026 - the front door. One page listing the five applications
  and the ten device simulators, in English, French and Dutch.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The shared foundation. The portal uses a small part of it - the theme, the
  # application badges and the language switcher - so that the front door looks
  # like the rooms behind it. Refresh with ./tools/sync_core.sh
  hospital_core:
    path: packages/hospital_core

  intl: any
  provider: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
